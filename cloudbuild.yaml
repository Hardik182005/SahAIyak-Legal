steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sahayak-repo/sahayak-api:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sahayak-repo/sahayak-api:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sahayak-repo/sahayak-api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sahayak-api'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/sahayak-repo/sahayak-api:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sahayak-repo/sahayak-api:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sahayak-repo/sahayak-api:latest'

timeout: '600s'
